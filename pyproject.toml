[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plyght"
version = "1.0.0"
description = "Typed connectors for kafka, redis, postgres, s3 and sqlite, env driven settings, logging, and a fastapi service spine"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Parker" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Framework :: Pydantic :: 2",
]
dependencies = ["pydantic-settings>=2.4"]

[project.optional-dependencies]
kafka = ["aiokafka>=0.11"]
redis = ["redis>=5.0"]
postgres = ["psycopg[binary]>=3.2"]
s3 = ["boto3>=1.34"]
web = ["fastapi>=0.115", "uvicorn>=0.32"]
all = [
    "aiokafka>=0.11",
    "redis>=5.0",
    "psycopg[binary]>=3.2",
    "boto3>=1.34",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "moto[s3]>=5"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "mkdocs-glightbox>=0.4"]

[project.urls]
Homepage = "https://github.com/parkermmr/plyght"
Documentation = "https://plyght.teampixl.info"
Issues = "https://github.com/parkermmr/plyght/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/plyght"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["plyght"]
branch = true
