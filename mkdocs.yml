site_name: Plyght
site_description: Typed connectors, settings, logging and a FastAPI service spine
site_author: Parker
site_url: https://plyght.teampixl.info
repo_name: parkermmr/plyght
repo_url: https://github.com/parkermmr/plyght
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Connectors: connectors.md
  - Settings: settings.md
  - Web: web.md
  - Logging: logging.md
  - Reference: reference.md

theme:
  name: material
  favicon: img/logo.png
  logo: img/logo.png
  language: en
  font:
    text: Figtree
    code: JetBrains Mono
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - glightbox
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: sphinx
            show_root_heading: true
            show_source: false
            members_order: source
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - css/base.css
